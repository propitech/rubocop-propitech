Propitech/NoViewAssembly:
  Description: 'Keep data or object assembly out of view templates; consume controller-assigned objects and helpers instead.'
  Enabled: true
  VersionAdded: '0.1.0'
  Include:
    - 'app/views/**/*'

Propitech/CommentBudget:
  Description: 'Cap a comment run at MaxClassProseLines above a class or module, MaxProseLines elsewhere, and each comment line at MaxCommentLineLength; a directive stays exempt from both.'
  Enabled: false
  VersionAdded: '0.4.0'
  MaxProseLines: 2
  MaxClassProseLines: 1
  MaxCommentLineLength: 100

Propitech/EventStoreClientAccess:
  Description: 'Reach the event store only through the DomainEvents wrapper; never reference the store client or its library constants elsewhere.'
  Enabled: true
  VersionAdded: '0.6.0'
  Namespaces:
    - RubyEventStore
    - RailsEventStore
  ClientAccessors:
    - event_store
  Publisher: 'DomainEvents::Publisher'
  Exclude:
    - 'app/business_logic/domain_events.rb'
    - 'app/business_logic/domain_events/**/*'
    - 'config/initializers/domain_events.rb'
    - 'spec/support/domain_events.rb'
