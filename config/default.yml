Propitech/NoViewAssembly:
  Description: 'Keep data or object assembly out of view templates; consume controller-assigned objects and helpers instead.'
  Enabled: true
  VersionAdded: '0.1.0'
  Include:
    - 'app/views/**/*'

Propitech/CommentBudget:
  Description: 'Cap a comment run at MaxClassProseLines above a class or module, MaxProseLines elsewhere, and each comment line at MaxCommentLineLength; a directive stays exempt from both.'
  Enabled: false
  VersionAdded: '0.4.0'
  MaxProseLines: 2
  MaxClassProseLines: 1
  MaxCommentLineLength: 100

Propitech/EventStoreClientAccess:
  Description: 'Reach the event store only through the DomainEvents wrapper; never reference the store client or its library constants elsewhere.'
  Enabled: true
  VersionAdded: '0.6.0'
  Namespaces:
    - RubyEventStore
    - RailsEventStore
  ClientAccessors:
    - event_store
  Publisher: 'DomainEvents::Publisher'
  Exclude:
    - 'app/business_logic/domain_events.rb'
    - 'app/business_logic/domain_events/**/*'
    - 'config/initializers/domain_events.rb'
    - 'spec/support/domain_events.rb'

Propitech/EventName:
  Description: 'Name a domain event <domain>.<fact> by its place at DomainEvents::<Domain>::<Fact>, with the fact in the past tense.'
  Enabled: true
  VersionAdded: '0.7.0'
  Namespace: 'DomainEvents'
  BaseClass: 'Event'
  PastParticiples:
    - paid
    - sent
    - made
    - held
    - begun
    - gone
    - lost
    - taken
    - given
    - shown
    - built
    - bought
    - kept
    - left
    - spent
    - told
    - sold
    - found
    - won
    - chosen
    - written
    - broken
    - frozen
    - hidden
    - known
    - seen
    - done
    - reset
    - drawn
    - withdrawn
  ParticiplePrefixes:
    - re
    - over
    - under
    - un
    - mis
    - out
    - pre
    - up
  NotPastTense:
    - need
    - feed
    - speed
    - seed
    - bleed
    - breed
    - weed
    - deed
    - heed
    - creed
    - greed

Propitech/SubscriberShape:
  Description: 'Keep each event subscriber at <Domain>::<Reaction>Subscriber in its domain''s directory, inheriting the subscriber base; it publishes no event and calls only its own domain''s commands.'
  Enabled: true
  VersionAdded: '0.8.0'
  BaseClass: 'DomainEvents::Subscriber'
  Directory: 'app/jobs'
  NameSuffix: 'Subscriber'
  CommandsNamespace: 'Commands'
  EventNamespace: 'DomainEvents'
  Publisher: 'DomainEvents::Publisher'
  PublishMethods:
    - publish

Propitech/FormSignInOutsideAllowList:
  Description: 'Report a call to a configured sign-in method in any file outside the AllowedPaths globs.'
  Enabled: false
  VersionAdded: '0.9.0'
  Methods: []
  AllowedPaths: []

Propitech/AuditTagOnExampleGroup:
  Description: 'Put a configured audit tag on the example it audits, never on a describe, context or feature group.'
  Enabled: false
  VersionAdded: '0.9.0'
  Tags: []

Propitech/StyleReadInSystemSpec:
  Description: 'Warn about a computed-style or box read (getComputedStyle, getBoundingClientRect, native.size, native.location) in a system spec; pin it in a component or view spec, or disable the line with the reason.'
  Enabled: false
  Severity: warning
  VersionAdded: '0.9.0'
  Include:
    - 'spec/system/**/*'

Propitech/FileOutsideAllowList:
  Description: 'Report a file under Include that AllowedFiles does not list, once, on its first line; keep it with an allow-list entry or a rubocop:disable comment on line 1 that gives the reason.'
  Enabled: false
  VersionAdded: '0.10.0'
  Include: []
  AllowedFiles: []
