name: Ruby
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # Routed by the repo variable RUNNER_LABELS, the same contract every other
    # Propitech repo uses. A hardcoded ubuntu-latest is refused at dispatch once
    # the org's hosted-minute allowance is spent, and even before that GitHub
    # bills a one-minute minimum per job, so a short job costs far more in
    # rounding than in compute (SQH-1418).
    runs-on: ${{ vars.RUNNER_LABELS != '' && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    name: Ruby 3.4
    # ruby/setup-ruby refuses to install on a self-hosted runner: it reports the
    # platform as self-hosted and tells the caller to populate RUNNER_TOOL_CACHE
    # itself. Ruby therefore comes from the fleet's runner image, which carries
    # 3.4.9. The digest is the one medusa's ruby-rails-ci.yml defaults to; bump
    # them together.
    container:
      image: ghcr.io/propitech/runner-rails-8.1@sha256:df8bd45f9df37a79d7df7dfc7425c14a9ecadcaa4ec071776e0ddff4303e098a
    env:
      # The image ships gems under a root-owned system path; the runner uid
      # cannot write there, so keep the bundle inside the workspace.
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gems
        run: bundle install --jobs 4 --retry 3
      - name: Run the default task (rubocop + rspec)
        env:
          CI: true
        run: bundle exec rake
